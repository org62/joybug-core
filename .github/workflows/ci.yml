name: CI

on:
  # joybug-core has a single long-lived branch. Feature branches aren't listed under
  # `push`, so a PR gets exactly one run (the merge preview) instead of two.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A PR is built before merge as the merge preview (refs/pull/N/merge). When
    # nothing has landed on main in between - the normal case here - merging
    # produces an identical tree, so the push run would rebuild the same code.
    # Skip it for merge commits; direct pushes to main still build. If the merge
    # message ever differs (squash/rebase merge, edited message) this just runs,
    # so the failure mode is a redundant build, never a skipped one.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request ')
    uses: ./.github/workflows/_build.yml

  linux:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request ')
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install system packages
      # clang/libclang for the unicorn bindgen, python3-dev for keystone's cmake,
      # gcc (build-essential) for the ptrace test programs built by build.rs.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake pkg-config clang libclang-dev python3-dev

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --all-targets

    # The ptrace backend's integration tests launch their own children (no
    # Yama consent needed) and `sleeper` opts in to being attached to.
    - name: Test
      run: cargo test
