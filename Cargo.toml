[workspace]
# `winsandbox` (the Windows Sandbox wrapper + the ETW collector) is a member so it
# shares the root lockfile. It is a required dependency of the root package, so it
# always builds; leaving it out of `default-members` below only keeps it from being
# built/tested a second time as a standalone target.
members = [".", "winsandbox"]
default-members = ["."]

[package]
name = "joybug-core"
# 0.0.0 is a placeholder: the git tag is the only source of truth, and release CI
# stamps it here (and into Cargo.lock) before building. A local build reporting
# 0.0.0 from `jlua --version` / `dbg:server_info()` is correct - it isn't a release.
version = "0.0.0"
edition = "2024"

[lib]
name = "joybug_core"
path = "src/lib.rs"

# The one CLI. jlua is the REPL/script runner, the headless debug server
# (`--listen`), and the sandbox guest (`--listen` / `--out` / `--ui`), so there
# is a single binary to build, ship and stage.
[[bin]]
name = "jlua"
path = "src/bin/jlua.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.37", features = ["full", "rt"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock"
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Symbol processing dependencies
pelite = { git = "https://github.com/expend20/pelite", branch = "eh_patching" }
pdb = "0.8"
symsrv = "0.5"
msvc-demangler = "0.11"
uuid = { version = "1.6", features = ["v4"] }
dirs = "5.0"
capstone = "0.12"
regex = "1.10"
rayon = "1.10"
memmap2 = "0.9"
memchr = "2"
serde_json = "1"
socket2 = "0.5"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
unicorn-engine = { git = "https://github.com/expend20/unicorn", branch = "AVX2-port" }
hexpatch-keystone = "0.9"
mlua = { version = "0.10", features = ["lua54", "send", "vendored"] }
rustyline = "15"
# ELF + DWARF parsing (the offline ELF image, the Linux symbol backend): on
# every OS, so an ELF file opens in the viewer on Windows too. All three were
# already in the lock via symsrv/addr2line.
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std", "compression"] }
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
# Separate ELF debug files: `.gnu_debuglink` CRC, debuginfod downloads (the TLS
# flavour symsrv already pulls in).
crc32fast = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustc-demangle = "0.1"

# Windows Sandbox control (wsb.exe wrapper + ETW tracer driver). No feature flag
# on Windows - always compiled in; `sbx.status()` reports at runtime whether the
# host can actually boot a VM. It is a `cfg(windows)` dependency because its own
# deps (`windows`, `ferrisetw`) only build there; the `etw`/`sandbox` modules
# that use it are gated the same way in lib.rs.
[target.'cfg(windows)'.dependencies]
winsandbox = { path = "winsandbox" }

# The Linux (ptrace) backend: raw ptrace/procfs through libc, shell-style
# command-line splitting for `launch`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
shlex = "1"

[build-dependencies]
cc = "1.0"
