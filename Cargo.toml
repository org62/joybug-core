[workspace]
members = [".", "veh_shared", "veh_dll"]
# Build/test all members by default. Without this, plain `cargo build`/`cargo test`
# only operate on the root package (joybug-core) and skip the `veh_dll` cdylib, so the
# VEH integration tests can't find joybug_core_veh_dll.dll. See VehPlatform::find_veh_dll.
default-members = [".", "veh_shared", "veh_dll"]

[package]
name = "joybug-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "joybug_core"
path = "src/lib.rs"

[[bin]]
name = "joybug-core"
path = "src/main.rs"

[[bin]]
name = "trace"
path = "src/bin/trace.rs"

[[bin]]
name = "jlua"
path = "src/bin/jlua.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.37", features = ["full", "rt"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices"
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Symbol processing dependencies
pelite = { git = "https://github.com/expend20/pelite", branch = "eh_patching" }
pdb = "0.8"
symsrv = "0.5"
msvc-demangler = "0.11"
uuid = { version = "1.6", features = ["v4"] }
dirs = "5.0"
capstone = "0.12"
regex = "1.10"
rayon = "1.10"
memmap2 = "0.9"
socket2 = "0.5"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
unicorn-engine = { git = "https://github.com/expend20/unicorn", branch = "AVX2-port" }
hexpatch-keystone = "0.9"
mlua = { version = "0.10", features = ["lua54", "send", "vendored"] }
rustyline = "15"
joybug-core-veh-shared = { path = "veh_shared" }

[build-dependencies]
cc = "1.0"
